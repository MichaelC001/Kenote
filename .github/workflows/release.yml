name: "Release Kenote"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "macos-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Kenote v__VERSION__"
          releaseBody: |
            ## Kenote v__VERSION__

            ### ✨ What's New
            - **Live WYSIWYG Markdown Formatting**: In-place headings, bold, italics, strikethrough, checklists, blockquotes, and code blocks.
            - **Always-On-Top Pinning**: Keep notes floating on top of all apps (`Ctrl + P` or top bar pin icon).
            - **Local-First .md Storage**: Instant auto-saving to local `.md` markdown files.
            - **Browse Notes Switcher**: Instant fuzzy search & quick note switching (`Ctrl + O`).
            - **Command Actions Palette**: Quick command menu (`Ctrl + K`).
            - **Custom Accent Themes**: Customizable `#0399F7` Electric Blue and gradients.
            - **New Custom Icon**: Sleek glowing neon K notepad icon.

            ### 📦 Download & Install
            - **Windows**: Download the `.msi` or `-setup.exe` installer below.
            - **macOS**: Download the `.dmg` installer.
            - **Linux**: Download the `.AppImage` or `.deb` package.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
