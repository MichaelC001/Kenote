name: "Release Kenote"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "macos-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Kenote v__VERSION__"
          releaseBody: |
            ## KeNote v__VERSION__

            ### 🚀 Windows Startup & Background Ready
            - **Start KeNote with Windows**: Added an optional setting in Settings → General to start KeNote automatically on Windows login.
            - **Quiet Background Launch**: Starts quietly in the background without stealing focus or interrupting your workflow.
            - **Instant Global Launch**: Global Launch shortcut (`Alt + Shift + K` or custom) is ready immediately after Windows startup.
            - **Preserved Single Instance**: Opening KeNote while already running in the background instantly brings your existing window to the front.
            - **Normal Process Termination**: Explicitly quitting KeNote terminates the process normally.

            ### 🛠️ Improvements & Fixes
            - **OS-Level Authoritative Sync**: Startup state is queried and updated directly with the operating system for accurate status reporting.
            - **Custom Shortcut Compatibility**: Fully compatible with your existing customized Global Launch shortcut.

            ### 📦 Download & Install
            - **Windows**: Download the `.msi` or `-setup.exe` installer below.
            - **macOS**: Download the `.dmg` installer.
            - **Linux**: Download the `.AppImage` or `.deb` package.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
