name: "Release Kenote"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "macos-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Kenote v__VERSION__"
          releaseBody: |
            ## KeNote v__VERSION__

            KeNote `v__VERSION__` is a patch release fixing the global launcher shortcut reliability on Windows, eliminating silent fallback conflicts, and setting `Ctrl+Space` as the new default launcher hotkey.

            ### 🐛 Bug Fixes & Reliability
            - **Windows Extended Key Fix (`F13`–`F24` & Custom Hotkeys)**: Deferred global hotkey registration to ensure the Windows message loop is active before registering hooks, resolving issues where custom shortcuts like `Ctrl+Alt+F13` failed to trigger.
            - **Eliminated Silent Fallback**: Removed the silent fallback that secretly reverted to `Alt+Shift+K` when custom shortcut registration encountered startup timing delays.
            - **Ergonomic Default Hotkey (`Ctrl+Space`)**: Updated default launcher shortcut from `Alt+Shift+K` to `Ctrl+Space` across all settings, UI previews, and backend registration.

            ### 🗂️ Features from v0.6.0
            - **Collapsible Stacks (Sections)**: Create collapsible blocks with `/stack [title]`, `Ctrl+Shift+S`, or the toolbar stack icon.
            - **Offline Spellcheck & Suggestions**: Built-in morphological spelling checker with instant right-click word selection and custom user dictionary.
            - **Expanded Slash Commands**: Numbered lists, date & time suite (`/today`, `/now`, etc.), and live GitHub-style callouts (`[!NOTE]`, `[!WARNING]`, etc.).

            ### 📦 Download & Install
            - **Windows**: Download the `.msi` or `-setup.exe` installer below.
            - **macOS**: Download the `.dmg` installer.
            - **Linux**: Download the `.AppImage` or `.deb` package.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
