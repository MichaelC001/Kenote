name: "Release Kenote"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "macos-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Kenote v__VERSION__"
          releaseBody: |
            ## KeNote v__VERSION__

            KeNote `v__VERSION__` is a major feature update introducing **Collapsible Stacks**, **Offline Spellcheck & Quick Suggestions**, an **Expanded Slash Command Suite**, and live **Callout Alerts**.

            ### 🗂️ Collapsible Stacks (Sections)
            - **Quick Creation**: Create collapsible blocks with `/stack [title]`, `Ctrl+Shift+S`, or the toolbar stack icon.
            - **Wrap Selection**: Wrap any selected text directly into a stack with zero friction.
            - **Inline Argument Pill**: Type `/stack [title]` to set stack titles seamlessly within the editor stream.
            - **6 Accent Color Themes**: Choose from Default (Slate), Blue, Emerald, Amber, Purple, or Rose with custom left borders and header gradient tints.
            - **Header Actions Menu (`···`)**: Duplicate, Unwrap (dissolve container while preserving contents), Copy Markdown/Plain Text, and Delete.
            - **Bulk Commands**: "Collapse All Stacks" (`Ctrl+Alt+[`) and "Expand All Stacks" (`Ctrl+Alt+]`) via keyboard shortcuts, Stack `···` menu, and Command Palette (`Ctrl+K`).
            - **Native Markdown Persistence**: Stored portably as `:::kenote-section title="..." color="..." isCollapsed="true"`.

            ### ✍️ Offline Spellcheck & Suggestions
            - **Offline English Lexicon**: Built-in morphological spelling checker without external network requests.
            - **Instant Word Selection**: Right-click on any misspelled word to auto-select it and see top correction suggestions.
            - **User Custom Dictionary**: "Add to Dictionary" learns your domain-specific terms and acronyms.
            - **Refined Context Menu**: Distraction-free native aesthetic without sparkles or bouncy animations.

            ### ⚡ Slash Commands & GitHub-Style Callouts
            - **Numbered Lists**: Quickly insert numbered lists with `/numbered`.
            - **Date & Time Suite**: Insert `/today` (DD/MM/YYYY), `/tomorrow`, `/yesterday`, `/time`, or `/now`.
            - **Live Alert Callouts**: Real-time decorative rendering for `> [!NOTE]`, `> [!TIP]`, `> [!IMPORTANT]`, `> [!WARNING]`, and `> [!CAUTION]`.
            - **Boundary Clamping**: Popup menus intelligently anchor upwards near viewport bottoms.

            ### 📦 Download & Install
            - **Windows**: Download the `.msi` or `-setup.exe` installer below.
            - **macOS**: Download the `.dmg` installer.
            - **Linux**: Download the `.AppImage` or `.deb` package.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
