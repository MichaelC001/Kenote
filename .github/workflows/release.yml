name: "Release Kenote"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "macos-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Kenote v__VERSION__"
          releaseBody: |
            ## KeNote v__VERSION__

            ### ✨ Improved
            - **Tactile Shortcut Keycaps**: Redesigned keyboard shortcuts with tactile keycap styling across Settings.
            - **Customizable Global Launch**: Global Launch shortcut can now be customized directly from Settings.
            - **Interactive Shortcut Recorder**: Compact shortcut recorder popover with live key preview and Escape-to-cancel.
            - **Configurable & Fixed Grouping**: Clear separation of customizable shortcuts and core fixed shortcuts.
            - **Reset to Default**: Easily restore default shortcut settings (`Alt + Shift + K`) with a single click.
            - **Conflict Feedback**: Clear warnings and conflict feedback when a shortcut is already in use.
            - **Extended Function Keys**: Added support for extended function keys F13 through F24.
            - **Hardware Shortcut Handling**: Improved compatibility with hardware keyboard shortcuts (e.g. `Ctrl + Alt + F13`).

            ### 🛠️ Reliability
            - **Safe Rollback**: Failed shortcut registrations safely roll back to the previous working shortcut.
            - **Persistent Configuration**: Custom shortcuts persist across application restarts.

            ### 📦 Download & Install
            - **Windows**: Download the `.msi` or `-setup.exe` installer below.
            - **macOS**: Download the `.dmg` installer.
            - **Linux**: Download the `.AppImage` or `.deb` package.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
