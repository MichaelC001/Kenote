[package]
name = "kenote"
version = "0.3.4"
description = "Kenote - Minimal Raycast-like Note Taking App"
authors = ["Kenote"]
edition = "2021"

[lib]
name = "kenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
